name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Две публикации одновременно ломают загрузку ассетов в один и тот же Worker.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # npm run deploy = typecheck + сборка фронта и бандла Worker + wrangler deploy.
      - name: Собрать и опубликовать
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
